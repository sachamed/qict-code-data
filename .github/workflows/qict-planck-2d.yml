name: QICT Planck 2D H0 lambda real likelihood
on:
  workflow_dispatch:
  push:
    branches: ['qict/microphysical-cmb-closure-2026-11-06']
    paths:
      - '.github/workflows/qict-planck-2d.yml'
      - 'code/qict_planck_h0_lambda_grid.py'
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native official Planck likelihood and CAMB
        run: |
          python -m pip install 'cobaya>=3.5' 'camb>=2.0.4' scipy numpy
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native -p /tmp/cobaya_packages
      - name: Evaluate 63 Planck TTTEEE low-T low-E cosmologies on (H0,lambda)
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: PYTHONPATH=code python code/qict_planck_h0_lambda_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-planck-2d-H0-lambda-conditional
          path: results/qict_planck_h0_lambda/
          if-no-files-found: warn
