name: QICT conditional Z3 two-phase homogeneous cosmology
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_z3_two_phase_background.py'
      - '.github/workflows/qict-z3-two-phase-background.yml'
permissions:
  contents: read
jobs:
  homogeneous:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerically integrate two phase degrees of freedom in Friedmann background
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy scipy
          python -m py_compile code/qict_z3_two_phase_background.py
          python code/qict_z3_two_phase_background.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-z3-two-phase-homogeneous-background
          path: results/qict_z3_two_phase_background/
          if-no-files-found: warn
