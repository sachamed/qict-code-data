name: QICT rotor exact Planck reproducibility source freeze
on:
  push:
    branches: ['qict/rotor-exact-boltzmann-2026-11-07']
    paths: ['.github/workflows/qict-rotor-exact-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source and commitment
        run: |
          mkdir -p results/qict_rotor_provenance/code results/qict_rotor_provenance/workflows results/qict_rotor_provenance/docs
          git rev-parse HEAD > results/qict_rotor_provenance/COMMIT.txt
          cp code/qict_direct_axion_planck.py code/qict_direct_rotor_cdm_scan.py code/qict_direct_rotor_act_primary.py code/qict_planck_native_fixed.py results/qict_rotor_provenance/code/
          cp .github/workflows/qict-direct-rotor-planck.yml .github/workflows/qict-direct-rotor-cdm-grid.yml .github/workflows/qict-direct-rotor-act-primary.yml results/qict_rotor_provenance/workflows/
          cp docs/qict_charge_normalized_receiver_finite_N_2026-11-07.md results/qict_rotor_provenance/docs/
          find results/qict_rotor_provenance -type f ! -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > results/qict_rotor_provenance/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qict-exact-rotor-executed-source-freeze
          path: results/qict_rotor_provenance/
          if-no-files-found: error
