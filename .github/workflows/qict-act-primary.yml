name: QICT official ACT DR6 primary TT TE EE CMB-lite
on:
  workflow_dispatch:
  push:
    branches: ['qict/microphysical-cmb-closure-2026-11-06']
    paths:
      - '.github/workflows/qict-act-primary.yml'
      - 'code/qict_act_dr6_primary_fixed.py'
permissions:
  contents: read
jobs:
  act_dr6_primary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official ACT collaboration DR6 CMB-lite and CAMB
        run: |
          python -m pip install 'cobaya>=3.5' 'camb>=2.0.4' numpy scipy
          git clone --depth 1 https://github.com/ACTCollaboration/DR6-ACT-lite.git /tmp/DR6-ACT-lite
          python -m pip install -e /tmp/DR6-ACT-lite
          cobaya-install act_dr6_cmbonly -p /tmp/cobaya_packages
      - name: Evaluate observed TT, TE, EE likelihood at QICT fixed point
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: PYTHONPATH=code python code/qict_act_dr6_primary_fixed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-act-dr6-primary-real-likelihood
          path: results/qict_act_primary/
          if-no-files-found: warn
