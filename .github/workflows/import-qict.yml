name: Import QICT reproducibility archive

on:
  push:
    paths:
      - ".github/workflows/import-qict.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-qict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install downloader
        run: python -m pip install --quiet gdown

      - name: Download exact QICT archive
        run: |
          gdown "https://drive.google.com/uc?id=1jc_YhuKlVuZSqmuZbNQeAQNcHQ-k4gaS" -O /tmp/qict.zip
          echo "3bbc2f8da66fcd3d6f5f5d36234ff2ac96fad1b7cbe03b66c61f3093b7f59a38  /tmp/qict.zip" | sha256sum -c -

      - name: Expand reproducibility payload
        run: |
          rm -rf /tmp/qict
          mkdir -p /tmp/qict
          unzip -q /tmp/qict.zip -d /tmp/qict
          rsync -a --delete             --exclude ".git/"             --exclude ".github/"             /tmp/qict/ ./
          rm -f AUTH_WRITE_TEST.txt

      - name: Verify expected release structure
        run: |
          test -f README.md
          test -f REPRODUCE_ALL.py
          test -d code
          test -d data
          test -d results
          test -d validation
          count="$(find . -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l)"
          echo "Imported payload files: $count"
          test "$count" -eq 348

      - name: Commit exact code and data release
        run: |
          git config user.name "QICT Reproducibility Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish QICT code, data, results, and validation archive"
          git push origin HEAD:main
