name: QICT direct-field Planck three-coordinate degeneracy
on:
  push:
    branches: ['qict/rotor-exact-boltzmann-2026-11-07']
    paths:
      - 'code/qict_direct_rotor_cdm_scan.py'
      - '.github/workflows/qict-direct-rotor-cdm-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct_field_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAMB scalar and native Planck likelihood
        run: |
          python -m pip install 'camb==2.0.5' 'cobaya>=3.5' numpy scipy
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native -p /tmp/cobaya_packages
      - name: Evaluate official Planck data on H0 omega_c n_s grid with scalar perturbations
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_direct_rotor_cdm_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-exact-rotor-planck-24point-matter-degeneracy
          path: results/qict_direct_rotor_cdm_scan/
          if-no-files-found: warn
