name: QICT physical EDE peak-shooting with official Planck and DESI
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_peak_calibrated_observed.py'
      - '.github/workflows/qict-peak-calibrated-observed.yml'
permissions:
  contents: read
jobs:
  physical_peak:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cobaya and official Planck 2018 DESI DR2 data
        run: |
          python -m pip install 'cobaya>=3.5.6' numpy scipy cython wheel setuptools
          cobaya-install planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lowl.TT planck_2018_lowl.EE bao.desi_dr2 -p /tmp/cobaya_packages
      - name: Pin and patch full native QICT interacting CLASS
        run: |
          git clone --no-checkout https://github.com/kabeleh/iDM.git /tmp/qict_idm
          git -C /tmp/qict_idm fetch --depth 1 origin dc55e59dec8f5c647df6e9d764f5c6960796e1df
          git -C /tmp/qict_idm checkout --detach dc55e59dec8f5c647df6e9d764f5c6960796e1df
          python scripts/patch_idm_qict_class.py /tmp/qict_idm
          python code/qict_patch_negative_scf_shoot.py /tmp/qict_idm
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/qict_idm/source/background.c')
          s=p.read_text(); old='#define _BACKGROUND_MAX_FEVALS_ 100000'
          assert s.count(old)==1
          p.write_text(s.replace(old,'#define _BACKGROUND_MAX_FEVALS_ 350000'))
          PY
          make -C /tmp/qict_idm -j2 class
          python -m pip install -e /tmp/qict_idm --no-build-isolation
      - name: Shoot actual zpeak/fpeak and measure Planck+DESI
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m py_compile code/qict_peak_calibrated_observed.py
          python code/qict_peak_calibrated_observed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-physical-peak-shooting-Planck-DESI
          path: results/qict_peak_calibration/
          if-no-files-found: warn
