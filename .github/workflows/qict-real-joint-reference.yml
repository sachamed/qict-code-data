name: QICT joint reference real Planck ACT DESI SH0ES fixed point
on:
  workflow_dispatch:
  push:
    branches: ['qict/coupled-joint-likelihood-gate-2026-11-07']
    paths: ['code/qict_real_joint_lcdm_reference.py','.github/workflows/qict-real-joint-reference.yml']
permissions:
  contents: read
jobs:
  joint_lcdm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ACT DR6 data and Planck+DESI likelihoods
        run: |
          python -m pip install 'cobaya>=3.5.6' 'camb==2.0.5' numpy scipy pyyaml
          cobaya-install planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lowl.TT planck_2018_lowl.EE bao.desi_dr2 -p /tmp/cobaya_packages
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          python -m pip install -e /tmp/act_dr6_lenslike
          cd /tmp
          # Cobaya's global packages_path requires ACT files under its data directory.
          mkdir -p /tmp/cobaya_packages/data/ACT_dr6_likelihood
          ln -s /tmp/act_dr6_lenslike/act_dr6_lenslike/data/v1.2 /tmp/cobaya_packages/data/ACT_dr6_likelihood/v1.2
      - name: Confirm ACT v1.2 release installed
        run: |
          python - <<'PY'
          import act_dr6_lenslike
          from pathlib import Path
          d=Path(act_dr6_lenslike.__file__).resolve().parent/'data/v1.2'
          assert d.is_dir(), d
          assert (Path('/tmp/cobaya_packages/data/ACT_dr6_likelihood/v1.2')).is_dir()
          print('ACT DR6 v1.2 installed:',d)
          PY
      - name: Evaluate official data likelihoods at LCDM baseline and 73.04 point
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_real_joint_lcdm_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-real-joint-Planck-ACT-DESI-SH0ES-LCDM-baseline
          path: results/qict_joint_reference_lcdm/
          if-no-files-found: warn
