name: QICT parity-safe two-field EFT and independent central dark Z2
on:
  workflow_dispatch:
  push:
    branches: ['qict/parity-stable-multifield-closure-2026-11-07']
    paths:
      - 'code/qict_independent_dark_parity.py'
      - '.github/workflows/qict-independent-dark-parity.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact D3 group, central dark parity, ghost positivity and mass tests
        run: |
          python -m pip install numpy
          python -m py_compile code/qict_independent_dark_parity.py
          OPENBLAS_NUM_THREADS=1 python code/qict_independent_dark_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-independent-central-dark-parity-proof
          path: results/qict_dark_parity_extension/
          if-no-files-found: warn
