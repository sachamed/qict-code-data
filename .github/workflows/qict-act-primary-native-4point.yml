name: QICT native CLASS observed ACT DR6 primary-only four-point diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_act_primary_native_qict.py'
      - '.github/workflows/qict-act-primary-native-4point.yml'
permissions:
  contents: read
jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official ACT DR6 CMB lite, Cobaya, and nuisance data
        run: |
          python -m pip install 'cobaya>=3.5.6' numpy scipy cython setuptools wheel
          git clone --depth 1 https://github.com/ACTCollaboration/DR6-ACT-lite.git /tmp/DR6-ACT-lite
          python -m pip install -e /tmp/DR6-ACT-lite
          cobaya-install act_dr6_cmbonly -p /tmp/cobaya_packages
      - name: Pin and compile interacting QICT CLASS
        run: |
          git clone --no-checkout https://github.com/kabeleh/iDM.git /tmp/qict_idm
          git -C /tmp/qict_idm fetch --depth 1 origin dc55e59dec8f5c647df6e9d764f5c6960796e1df
          git -C /tmp/qict_idm checkout --detach dc55e59dec8f5c647df6e9d764f5c6960796e1df
          python scripts/patch_idm_qict_class.py /tmp/qict_idm
          python code/qict_patch_negative_scf_shoot.py /tmp/qict_idm
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/qict_idm/source/background.c')
          s=p.read_text();old='#define _BACKGROUND_MAX_FEVALS_ 100000'
          assert s.count(old)==1
          p.write_text(s.replace(old,'#define _BACKGROUND_MAX_FEVALS_ 350000'))
          PY
          make -C /tmp/qict_idm -j2 class
          python -m pip install -e /tmp/qict_idm --no-build-isolation
      - name: Execute ACT DR6 primary CMB-only likelihood
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m py_compile code/qict_act_primary_native_qict.py
          python code/qict_act_primary_native_qict.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-actual-ACT-DR6-primary-only-matched-points
          path: results/qict_act_dr6_primary_qict/
          if-no-files-found: warn
