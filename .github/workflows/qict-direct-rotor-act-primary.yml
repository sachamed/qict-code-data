name: QICT direct cubic rotor ACT DR6 primary TTTEEE validation
on:
  push:
    branches: ['qict/rotor-exact-boltzmann-2026-11-07']
    paths: ['.github/workflows/qict-direct-rotor-act-primary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act_primary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAMB and official ACT DR6 foreground-marginalised CMB-lite
        run: |
          python -m pip install 'camb==2.0.5' 'cobaya>=3.5' numpy scipy
          git clone --depth 1 https://github.com/ACTCollaboration/DR6-ACT-lite.git /tmp/DR6-ACT-lite
          python -m pip install -e /tmp/DR6-ACT-lite
          cobaya-install act_dr6_cmbonly -p /tmp/cobaya_packages
      - name: Evaluate exact full-field ACT DR6 temperature and polarisation likelihood
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_direct_rotor_act_primary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-direct-rotor-ACT-primary-measured
          path: results/qict_direct_rotor_act_primary/
          if-no-files-found: warn
