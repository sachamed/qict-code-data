name: QICT end-to-end finite reproduction

on:
  push:
    paths:
      - ".github/workflows/qict-finite-reproduction.yml"
      - "REPRODUCE_ALL.py"
      - "code/**"
      - "data/**"
      - "science_checks/**"
  pull_request:
    paths:
      - ".github/workflows/qict-finite-reproduction.yml"
      - "REPRODUCE_ALL.py"
      - "code/**"
      - "data/**"
      - "science_checks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-finite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install pinned numerical dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Reproduce all documented finite computational results
        run: python REPRODUCE_ALL.py
      - name: Confirm non-promoted physical gate
        run: |
          set +e
          python QICT_FULL_PHYSICAL_EXECUTION/src/stage_guard.py --stage mass > /tmp/qict-physical-status.log
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then
            cat /tmp/qict-physical-status.log
            echo "Expected fail-closed mass-stage status (exit 2); got $result"
            exit 1
          fi
          grep -q BLOCKED_MISSING_INPUT /tmp/qict-physical-status.log
      - name: Upload reproduction summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qict-end-to-end-finite-reproduction
          path: |
            validation/reproduce_numerics.txt
            validation/reproduce_neutrino_shape.txt
            /tmp/qict-physical-status.log
          if-no-files-found: ignore
