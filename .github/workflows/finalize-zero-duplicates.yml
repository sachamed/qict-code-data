name: Finalize zero-duplicate QICT repository

on:
  push:
    paths:
      - ".github/workflows/finalize-zero-duplicates.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonicalize final duplicate and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, csv, json, hashlib

          ROOT=Path(".").resolve()
          dup=Path("data/physical_g2_inputs/QICT_REQUESTED_C9_G2_PHYSICAL_ELEMENTS_2026-10-06/01_SOURCE_PACKAGES/L24_RANK6_STATE_CONTRACTION_PAYLOAD_2026-10-04/MANIFEST_SHA256.txt")
          canon=Path("data/physical_g2_inputs/L24_RANK6_STATE_CONTRACTION_PAYLOAD_2026-10-04/MANIFEST_SHA256.txt")

          if not canon.exists():
              raise SystemExit("Canonical manifest missing")

          if dup.exists() or dup.is_symlink():
              if dup.is_symlink():
                  dup.unlink()
              else:
                  # Protect against accidental non-identical replacement.
                  if dup.read_bytes() != canon.read_bytes():
                      raise SystemExit("Final manifest candidate is not byte-identical to canonical manifest")
                  dup.unlink()
              dup.symlink_to(os.path.relpath(canon, dup.parent))

          # Update deduplication map idempotently.
          m=Path("DEDUPLICATION_MAP.csv")
          rows=[]
          if m.exists():
              with m.open(newline="") as f:
                  rows=list(csv.reader(f))
          header=["action","path","canonical_target"]
          entry=[
              "symlink_alias",
              str(dup),
              str(canon)
          ]
          body=rows[1:] if rows and rows[0]==header else rows
          body=[r for r in body if not (len(r)>=2 and r[1]==str(dup))]
          body.append(entry)
          with m.open("w",newline="") as f:
              w=csv.writer(f)
              w.writerow(header)
              w.writerows(body)

          # Update audit to the final canonical state.
          a=Path("DEDUPLICATION_AUDIT.json")
          obj=json.loads(a.read_text())
          obj["actions"]["symlink_aliases"]=55
          obj["actions"]["total"]=115
          obj["after"]["symlink_alias_count"]=55
          obj["after"]["regular_duplicate_groups"]=0
          obj["after"]["regular_duplicate_instances"]=0
          obj["remaining_regular_duplicates"]={}
          a.write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          # Remove this one-shot workflow before generating public manifests.
          wf=Path(".github/workflows/finalize-zero-duplicates.yml")
          if wf.exists(): wf.unlink()
          for d in [Path(".github/workflows"),Path(".github")]:
              if d.exists():
                  try: d.rmdir()
                  except OSError: pass

          def sha256(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()

          def build_manifest(path,prefix=""):
              lines=[]
              for p in sorted(ROOT.rglob("*")):
                  if not p.is_file() or ".git" in p.parts: continue
                  if p.name in {"GITHUB_EXPORT_SHA256.txt","MANIFEST_SHA256.txt"} and p.parent==ROOT:
                      continue
                  rel=str(p.relative_to(ROOT))
                  lines.append(f"{sha256(p)}  {prefix}{rel}")
              path.write_text("\n".join(lines)+"\n")

          build_manifest(Path("GITHUB_EXPORT_SHA256.txt"))
          build_manifest(Path("MANIFEST_SHA256.txt"),"./")

          # Final exact-content audit over stored regular files.
          regular=[
              p for p in ROOT.rglob("*")
              if p.is_file() and not p.is_symlink() and ".git" not in p.parts
          ]
          groups={}
          for p in regular:
              groups.setdefault(sha256(p),[]).append(str(p.relative_to(ROOT)))
          dups={h:ps for h,ps in groups.items() if len(ps)>1}
          if dups:
              raise SystemExit("Regular exact duplicates remain: "+json.dumps(dups,indent=2))

          # Integrity check for all public paths, including symlink aliases.
          print(json.dumps({
              "regular_duplicate_groups":0,
              "symlink_aliases":sum(1 for p in ROOT.rglob("*") if p.is_symlink()),
              "finalized_manifest_alias":str(dup),
              "target":str(canon)
          },indent=2))
          PY

          sha256sum -c GITHUB_EXPORT_SHA256.txt >/tmp/qict_integrity_final.txt

      - name: Commit final zero-duplicate state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize zero-duplicate QICT repository"
          git push origin main
