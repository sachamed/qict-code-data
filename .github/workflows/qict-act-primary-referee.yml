name: Referee-corrected QICT ACT DR6 primary nonlinear likelihood
on:
  push:
    branches: ['qict/referee-act-correction-2026-11-07']
    paths: ['.github/workflows/qict-act-primary-referee.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act_primary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ACT DR6 CMB-lite and CAMB HMCode
        run: |
          python -m pip install 'cobaya>=3.5' 'camb==2.0.5' numpy scipy
          git clone --depth 1 https://github.com/ACTCollaboration/DR6-ACT-lite.git /tmp/DR6-ACT-lite
          python -m pip install -e /tmp/DR6-ACT-lite
          cobaya-install act_dr6_cmbonly -p /tmp/cobaya_packages
      - name: Evaluate observed ACT DR6 TTTEEE with nonlinear spectra
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_act_dr6_primary_fixed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-referee-act-primary-HMCode
          path: results/qict_act_primary/
          if-no-files-found: warn
