name: Referee-corrected Planck 2D QICT H0 lambda HMCode grid
on:
  push:
    branches: ['qict/referee-act-correction-2026-11-07']
    paths:
      - '.github/workflows/qict-planck-2d-referee.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Planck and CAMB nonlinear
        run: |
          python -m pip install 'cobaya>=3.5' 'camb==2.0.5' numpy scipy
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native -p /tmp/cobaya_packages
      - name: Recompute 63 real Planck primary points with HMCode
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_planck_h0_lambda_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-referee-planck-HMCode-H0-lambda-grid
          path: results/qict_planck_h0_lambda/
          if-no-files-found: warn
