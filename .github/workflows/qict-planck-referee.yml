name: Referee-corrected QICT Planck nonlinear native likelihood
on:
  push:
    branches: ['qict/referee-act-correction-2026-11-07']
    paths:
      - '.github/workflows/qict-planck-referee.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cobaya native Planck and CAMB 2.0.5
        run: |
          python -m pip install 'cobaya>=3.5' 'camb==2.0.5' numpy scipy
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lensing.native -p /tmp/cobaya_packages
      - name: Recompute observed QICT likelihood with HMCode nonlinear correction
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: PYTHONPATH=code python code/qict_planck_native_fixed.py --packages-path /tmp/cobaya_packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-referee-planck-HMCode-likelihood
          path: results/qict_planck_native/
          if-no-files-found: warn
