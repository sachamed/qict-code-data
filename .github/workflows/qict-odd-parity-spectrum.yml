name: QICT exact odd-parity spectral gap under charge inertia
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_odd_parity_spectrum.py'
      - '.github/workflows/qict-odd-parity-spectrum.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Diagonalize even and odd Schwinger receiver spin sectors
        run: |
          python -m py_compile code/qict_odd_parity_spectrum.py
          python code/qict_odd_parity_spectrum.py
      - uses: actions/upload-artifact@v4
        with:
          name: qict-finite-N-odd-parity-eigenspectra
          path: results/qict_odd_parity_spectrum/
          if-no-files-found: error
