name: QICT Friedmann closure and native acoustic-scale audit
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_friedmann_acoustic_audit.py'
      - '.github/workflows/qict-friedmann-acoustic-audit.yml'
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin and patch CLASS
        run: |
          git clone --no-checkout https://github.com/kabeleh/iDM.git /tmp/qict_idm
          git -C /tmp/qict_idm fetch --depth 1 origin dc55e59dec8f5c647df6e9d764f5c6960796e1df
          git -C /tmp/qict_idm checkout --detach dc55e59dec8f5c647df6e9d764f5c6960796e1df
          python scripts/patch_idm_qict_class.py /tmp/qict_idm
          python code/qict_patch_negative_scf_shoot.py /tmp/qict_idm
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/qict_idm/source/background.c')
          s=p.read_text()
          old='#define _BACKGROUND_MAX_FEVALS_ 100000'
          assert s.count(old)==1
          p.write_text(s.replace(old,'#define _BACKGROUND_MAX_FEVALS_ 350000'))
          PY
      - name: Compile CLASS and classy
        run: |
          python -m pip install cython wheel numpy scipy
          make -C /tmp/qict_idm -j2 class
          python -m pip install -e /tmp/qict_idm --no-build-isolation
          python -m py_compile code/qict_friedmann_acoustic_audit.py
      - name: Verify native H0 acoustic calibration and scalar closure
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
        run: python code/qict_friedmann_acoustic_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-friedmann-acoustic-calibration-six-models
          path: results/qict_friedmann_acoustic_audit/
          if-no-files-found: warn
