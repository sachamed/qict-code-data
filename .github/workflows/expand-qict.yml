name: Publish QICT reproducibility archive

on:
  push:
    paths:
      - ".qict-upload/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f /tmp/part-*.b64 /tmp/part-*.bin
          for first in .qict-upload/part-*.000.b64; do
            base="$(basename "$first" .000.b64)"
            chunks=(.qict-upload/"$base".*.b64)
            test "${#chunks[@]}" -gt 0
            cat "${chunks[@]}" > "/tmp/$base.b64"
            base64 --decode "/tmp/$base.b64" > "/tmp/$base.bin"
          done
          bins=(/tmp/part-*.bin)
          test "${#bins[@]}" -eq 11
          cat /tmp/part-*.bin > /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip
          echo "3bbc2f8da66fcd3d6f5f5d36234ff2ac96fad1b7cbe03b66c61f3093b7f59a38  /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip" | sha256sum -c -

      - name: Extract and verify reproducibility package
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip -d .
          sha256sum -c GITHUB_EXPORT_SHA256.txt
          test -f README.md
          test -f REPRODUCE_ALL.py
          test -d code
          test -d data
          test -d results
          test -d validation

      - name: Remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qict-upload
          rm -f AUTH_WRITE_TEST.txt
          rm -f .github/workflows/import-qict.yml
          rm -f .github/workflows/expand-qict.yml

      - name: Commit published repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified QICT reproducibility code and data"
          git push origin main
