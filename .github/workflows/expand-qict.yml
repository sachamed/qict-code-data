name: Publish QICT reproducibility archive

on:
  push:
    paths:
      - ".qict-upload/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .qict-upload/part-*.bin > /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip
          echo "3bbc2f8da66fcd3d6f5f5d36234ff2ac96fad1b7cbe03b66c61f3093b7f59a38  /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip" | sha256sum -c -

      - name: Extract reproducibility package
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/QICT_GITHUB_CODE_DATA_RELEASE_2026-10-07.zip -d .
          sha256sum -c GITHUB_EXPORT_SHA256.txt

      - name: Remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qict-upload
          rm -f AUTH_WRITE_TEST.txt
          rm -f .github/workflows/expand-qict.yml

      - name: Commit published repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish QICT reproducibility code and data"
          git push origin main
