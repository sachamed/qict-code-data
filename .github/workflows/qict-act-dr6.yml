name: QICT official ACT DR6 lensing fixed-point evidence
on:
  push:
    branches: ['qict/microphysical-cmb-closure-2026-11-06']
    paths:
      - '.github/workflows/qict-act-dr6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_act:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAMB and ACT official likelihood
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'scipy>=1.12' 'camb>=2.0.4' act_dr6_lenslike
      - name: Obtain NASA LAMBDA ACT lensing v1.2 data release
        run: |
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          test -d act_dr6_lenslike/data/v1.2
          # point the pip-imported official module at the released data
          python - <<'PY'
          import act_dr6_lenslike as mod
          from pathlib import Path
          import shutil
          src=Path('/tmp/act_dr6_lenslike/act_dr6_lenslike/data/v1.2')
          dst=Path(mod.__file__).resolve().parent/'data/v1.2'
          dst.parent.mkdir(parents=True,exist_ok=True)
          if not dst.exists(): shutil.copytree(src,dst)
          print('Installed official ACT v1.2 likelihood release:',dst)
          PY
      - name: Compute two CAMB complete transfer-spectrum sets
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python code/qict_cmb_boltzmann.py --out results/qict_fixed_camblmax4000 --lmax 4000
          python code/qict_cmb_massive_boltzmann.py
      - name: Evaluate ACT standalone and ACT-Planck JOINT lensing alternatives
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_act_dr6_official_fixed.py
      - uses: actions/upload-artifact@v4
        with:
          name: qict-official-act-dr6-fixed-lensing
          path: results/qict_act_dr6_fixed_official/
          if-no-files-found: error
