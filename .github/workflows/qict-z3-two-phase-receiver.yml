name: QICT conditional Z3 two-relative-phase receiver theorem
on:
  workflow_dispatch:
  push:
    branches: ['qict/three-epoch-physical-consistency-2026-11-07']
    paths:
      - 'code/qict_z3_two_phase_receiver.py'
      - '.github/workflows/qict-z3-two-phase-receiver.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Z3 order and metric invariance, two-field Hessian and degeneracy
        run: |
          python -m pip install numpy
          python -m py_compile code/qict_z3_two_phase_receiver.py
          OPENBLAS_NUM_THREADS=1 python code/qict_z3_two_phase_receiver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-z3-two-phase-receiver-analytic
          path: results/qict_z3_two_phase/
          if-no-files-found: warn
