name: QICT high-energy joint observational H0 fixed-point gate
on:
  push:
    branches: ['qict/coupled-joint-likelihood-gate-2026-11-07']
    paths:
      - '.github/workflows/qict-high-energy-joint.yml'
      - 'code/qict_high_energy_joint_likelihood.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Planck and DESI likelihood packages
        run: |
          python -m pip install 'cobaya>=3.5.6' cython setuptools wheel numpy scipy
          cobaya-install planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lowl.TT planck_2018_lowl.EE bao.desi_dr2 -p /tmp/cobaya_packages
      - name: Install ACT DR6 v1.2 official combined lensing likelihood and data
        run: |
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          python -m pip install -e /tmp/act_dr6_lenslike
      - name: Checkout and patch QICT finite-N CLASS
        run: |
          git clone --no-checkout https://github.com/kabeleh/iDM.git /tmp/qict_idm
          git -C /tmp/qict_idm fetch --depth 1 origin dc55e59dec8f5c647df6e9d764f5c6960796e1df
          git -C /tmp/qict_idm checkout --detach dc55e59dec8f5c647df6e9d764f5c6960796e1df
          test "$(git -C /tmp/qict_idm rev-parse HEAD)" = dc55e59dec8f5c647df6e9d764f5c6960796e1df
          python scripts/patch_idm_qict_class.py /tmp/qict_idm
          python code/qict_patch_negative_scf_shoot.py /tmp/qict_idm
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/qict_idm/source/background.c')
          s=p.read_text()
          old='#define _BACKGROUND_MAX_FEVALS_ 100000'
          assert s.count(old)==1
          p.write_text(s.replace(old,'#define _BACKGROUND_MAX_FEVALS_ 350000'))
          PY
      - name: Compile native CLASS and Python interface
        run: |
          make -C /tmp/qict_idm -j2 class
          python -m pip install -e /tmp/qict_idm --no-build-isolation
          python - <<'PY'
          from classy import Class
          print('Native CLASS import passed:',Class)
          PY
      - name: Evaluate high-energy QICT with Planck, ACT-Planck and DESI
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_high_energy_joint_likelihood.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-high-energy-observed-Planck-ACT-DESI-H0-fixed-points
          path: results/qict_high_energy_joint_observed/
          if-no-files-found: warn
