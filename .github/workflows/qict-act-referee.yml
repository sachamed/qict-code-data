name: Referee-corrected QICT ACT DR6 full-primary-compatible lensing
on:
  push:
    branches: ['qict/referee-act-correction-2026-11-07']
    paths:
      - '.github/workflows/qict-act-referee.yml'
      - 'code/qict_act_corrected_lensing.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act_referee:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific environment
        run: python -m pip install 'camb==2.0.5' 'numpy>=1.26' 'scipy>=1.12'
      - name: Official ACT DR6 lensing v1.2 with correction matrices
        run: |
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          python -m pip install -e /tmp/act_dr6_lenslike
          cd /tmp
          python - <<'PY'
          import act_dr6_lenslike
          from pathlib import Path
          assert (Path(act_dr6_lenslike.__file__).resolve().parent/'data/v1.2').is_dir()
          PY
      - name: Compute corrected lensing likelihood alternatives
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          PYTHONPATH: code
        run: python code/qict_act_corrected_lensing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-referee-corrected-act-dr6
          path: results/qict_corrected_act_dr6/
          if-no-files-found: warn
