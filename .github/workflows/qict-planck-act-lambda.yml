name: QICT measured Planck + ACT DR6 one-dimensional conditional profile
on:
  workflow_dispatch:
  push:
    branches: ['qict/microphysical-cmb-closure-2026-11-06']
    paths:
      - '.github/workflows/qict-planck-act-lambda.yml'
      - 'code/qict_planck_act_conditional_scan.py'
permissions:
  contents: read
jobs:
  conditional_profile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Planck official native packages, CAMB and ACT
        run: |
          python -m pip install 'cobaya>=3.5' 'camb>=2.0.4' scipy numpy act_dr6_lenslike
          cobaya-install planck_2018_lowl.TT planck_2018_lowl.EE planck_2018_highl_plik.TTTEEE_lite_native -p /tmp/cobaya_packages
      - name: Fetch official NASA LAMBDA ACT DR6 lensing v1.2
        run: |
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          python -m pip install -e /tmp/act_dr6_lenslike
          cd /tmp
          python - <<'PY'
          import act_dr6_lenslike
          from pathlib import Path
          assert (Path(act_dr6_lenslike.__file__).resolve().parent/'data/v1.2').is_dir()
          PY
      - name: Evaluate measured Planck-primary and overlap-aware ACT lensing grid
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          PYTHONPATH=code python code/qict_planck_act_conditional_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-conditional-planck-act-lambda-profile
          path: results/qict_planck_act_conditional/
          if-no-files-found: warn
