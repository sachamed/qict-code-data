name: QICT measured joint Planck ACT DESI weak coupled CLASS baseline
on:
  workflow_dispatch:
  push:
    branches: ['qict/coupled-joint-likelihood-gate-2026-11-07']
    paths:
      - 'code/qict_class_cobaya_joint.py'
      - '.github/workflows/qict-native-joint-observed.yml'
permissions:
  contents: read
jobs:
  qict_observed:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Planck DESI Cobaya and Cython
        run: |
          python -m pip install 'cobaya>=3.5.6' cython setuptools wheel numpy scipy
          cobaya-install planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lowl.TT planck_2018_lowl.EE bao.desi_dr2 -p /tmp/cobaya_packages
      - name: Prepare ACT DR6 v1.2 official covariances and data
        run: |
          git clone --depth 1 https://github.com/ACTCollaboration/act_dr6_lenslike.git /tmp/act_dr6_lenslike
          cd /tmp/act_dr6_lenslike
          bash get-act-data.sh
          python -m pip install -e /tmp/act_dr6_lenslike
          cd /tmp
          python - <<'PY'
          import act_dr6_lenslike
          from pathlib import Path
          assert (Path(act_dr6_lenslike.__file__).resolve().parent/'data/v1.2').is_dir()
          PY
      - name: Patch and compile interacting CLASS for QICT finite charge
        run: |
          git clone --depth 1 https://github.com/kabeleh/iDM.git /tmp/qict_idm
          python scripts/patch_idm_qict_class.py /tmp/qict_idm
          make -C /tmp/qict_idm -j2 class
          python -m pip install -e /tmp/qict_idm --no-build-isolation
          python - <<'PY'
          import classy
          print('Patched CLASS loaded:',classy.__file__)
          PY
      - name: Evaluate real QICT g0 and g002 against Planck ACTPlanck DESI and SH0ES
        env:
          PYTHONPATH: code
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python code/qict_class_cobaya_joint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qict-real-joint-CLASS-coupled-Planck-ACT-DESI-SH0ES
          path: results/qict_native_joint_observed/
          if-no-files-found: warn
